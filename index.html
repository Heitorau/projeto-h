
<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini H</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  border-right:1px solid #222;
  padding:20px;
  position:fixed;
  height:100vh;
  background:#000;
}

.logo{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#1d9bf0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  font-weight:bold;
  margin-bottom:30px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.menu button{
  background:none;
  border:none;
  color:white;
  font-size:20px;
  text-align:left;
  padding:12px;
  border-radius:30px;
  cursor:pointer;
  transition:0.2s;
}

.menu button:hover{
  background:#111;
}

.profile-mini{
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:30px;
}

.profile-mini:hover{
  background:#111;
}

.profile-mini img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

/* CONTEÚDO */

.main{
  margin-left:260px;
  width:100%;
  max-width:700px;
  border-right:1px solid #222;
}

.topbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.9);
  backdrop-filter:blur(10px);
  padding:18px;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

.post-box{
  padding:20px;
  border-bottom:1px solid #222;
}

.post-box textarea{
  width:100%;
  background:none;
  border:none;
  color:white;
  resize:none;
  font-size:20px;
  outline:none;
  min-height:100px;
}

.input-style{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  border:none;
  border-radius:10px;
  color:white;
}

.post-btn{
  background:#1d9bf0;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:30px;
  margin-top:15px;
  font-weight:bold;
  cursor:pointer;
  float:right;
}

.post-btn:hover{
  opacity:0.9;
}

/* POSTS */

.post{
  padding:20px;
  border-bottom:1px solid #222;
  transition:0.2s;
}

.post:hover{
  background:#080808;
}

.post-header{
  display:flex;
  align-items:center;
  gap:12px;
}

.post-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

.username{
  font-weight:bold;
}

.handle{
  color:gray;
}

.post-content{
  margin-top:15px;
  margin-left:62px;
}

.post-content img,
.post-content video{
  width:100%;
  border-radius:18px;
  margin-top:15px;
  border:1px solid #222;
}

.actions{
  display:flex;
  gap:20px;
  margin-top:15px;
}

.actions button{
  background:none;
  border:none;
  color:gray;
  cursor:pointer;
  font-size:16px;
}

.actions button:hover{
  color:#1d9bf0;
}

/* LOGIN */

#loginScreen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.login-box{
  background:#111;
  padding:40px;
  border-radius:20px;
  width:95%;
  max-width:450px;
}

.login-title{
  text-align:center;
  margin-bottom:25px;
  font-size:35px;
  font-weight:bold;
}

.login-title span{
  color:#1d9bf0;
}

.login-input{
  width:100%;
  padding:14px;
  background:#222;
  border:none;
  border-radius:10px;
  margin-top:12px;
  color:white;
}

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#1d9bf0;
  color:white;
  margin-top:15px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:900px){

  .sidebar{
    width:90px;
  }

  .menu button{
    font-size:0;
  }

  .main{
    margin-left:90px;
  }

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-title">
      <span>H</span>
    </div>

    <input
      id="username"
      class="login-input"
      placeholder="Usuário"
    >

    <input
      id="password"
      class="login-input"
      type="password"
      placeholder="Senha"
    >

    <input
      id="avatar"
      class="login-input"
      placeholder="URL da foto de perfil"
      style="display:none;"
    >

    <button class="login-btn" onclick="toggleRegister()">
      Criar conta
    </button>

    <button class="login-btn" onclick="register()">
      Confirmar Cadastro
    </button>

    <button class="login-btn" onclick="login()">
      Entrar
    </button>

  </div>

</div>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    H
  </div>

  <div class="menu">

    <button>🏠 Início</button>
    <button>🔍 Explorar</button>
    <button>🔔 Notificações</button>
    <button>✉️ Mensagens</button>
    <button onclick="logout()">🚪 Sair</button>

  </div>

  <div class="profile-mini">

    <img
      id="sidebarAvatar"
      src="https://i.imgur.com/HeIi0wU.png"
    >

    <div>
      <div id="sidebarName">
        @usuario
      </div>
    </div>

  </div>

</div>

<!-- MAIN -->

<div class="main">

  <div class="topbar">
    <span id="welcomeText">
      Página Inicial
    </span>
  </div>

  <div class="post-box">

    <textarea
      id="texto"
      placeholder="O que está acontecendo?"
    ></textarea>

    <input
      id="media"
      class="input-style"
      type="file"
      accept="image/*,video/*"
    >

    <select id="tipo" class="input-style">

      <option value="image">
        Imagem
      </option>

      <option value="video">
        Vídeo
      </option>

    </select>

    <button class="post-btn" onclick="postar()">
      Postar
    </button>

    <div style="clear:both"></div>

  </div>

  <div id="feed"></div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxGFWZXKSSILpX8WiWA0AYE_jPEj4xRXv5dqTH_2kWtdmFmvZGRPtgwbWRR27hQiBWKhw/exec";

let currentUser = null;

// LOGIN SALVO
const savedUser = localStorage.getItem("miniHUser");

window.addEventListener("load", () => {

  if(savedUser){

    currentUser = JSON.parse(savedUser);

    document.getElementById("loginScreen")
      .style.display = "none";

    document.querySelector(".sidebar")
      .style.display = "block";

    document.querySelector(".main")
      .style.display = "block";

    document.getElementById("sidebarAvatar")
      .src = currentUser.avatar ||
      "https://i.imgur.com/HeIi0wU.png";

    document.getElementById("sidebarName")
      .innerText = "@" + currentUser.username;

    document.getElementById("welcomeText")
      .innerText = "Bem-vindo, @" + currentUser.username;

    document.getElementById("welcomeText")
      .innerText = "Bem-vindo, @" + currentUser.username;

    loadPosts();

  }

});

if(savedUser){

  currentUser = JSON.parse(savedUser);

  window.addEventListener("load", () => {

    document.getElementById("loginScreen")
      .style.display = "none";

    document.getElementById("sidebarAvatar")
      .src = currentUser.avatar ||
      "https://i.imgur.com/HeIi0wU.png";

    document.getElementById("sidebarName")
      .innerText = "@" + currentUser.username;

    document.getElementById("welcomeText")
      .innerText = "Bem-vindo, @" + currentUser.username;

    loadPosts();

    alert("Login realizado com sucesso");

  });

}

async function api(data){

  const req = await fetch(API, {

    method:"POST",

    body:JSON.stringify(data)

  });

  return req.json();

}

let registerMode = false;

function toggleRegister(){

  registerMode = !registerMode;

  const avatarInput =
    document.getElementById("avatar");

  if(registerMode){

    avatarInput.style.display = "block";

    document.querySelector(".login-title")
      .innerHTML = "<span>H</span> Criar Conta";

  } else {

    avatarInput.style.display = "none";

    document.querySelector(".login-title")
      .innerHTML = "<span>H</span>";

  }

}

async function register(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const avatar =
    document.getElementById("avatar").value;

  const res = await api({

    action:"register",

    username,

    password,

    avatar

  });

  alert(res.message);

  if(res.success){

    login();

  }

  if(res.success){

    document.getElementById("avatar")
      .style.display = "none";

    registerMode = false;

  }

}

async function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const res = await api({

    action:"login",

    username,

    password

  });

  if(res.success){

    currentUser = res.user;

    // SALVAR LOGIN
    localStorage.setItem(
      "miniHUser",
      JSON.stringify(currentUser)
    );

    // ESCONDER LOGIN
    document.getElementById("loginScreen")
      .style.display = "none";

    // MOSTRAR APP
    document.querySelector(".sidebar")
      .style.display = "block";

    document.querySelector(".main")
      .style.display = "block";

    // SALVAR LOGIN
    localStorage.setItem(
      "miniHUser",
      JSON.stringify(currentUser)
    );

    document.getElementById("loginScreen")
      .style.display = "none";

    document.getElementById("sidebarAvatar")
      .src = currentUser.avatar ||
      "https://i.imgur.com/HeIi0wU.png";

    document.getElementById("sidebarName")
      .innerText = "@" + currentUser.username;

    document.getElementById("welcomeText")
      .innerText = "Bem-vindo, @" + currentUser.username;

    loadPosts();

  } else {

    alert(res.message);

  }

}

function toBase64(file){

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = () => resolve(reader.result);

    reader.onerror = error => reject(error);

  });

}

async function postar(){

  // RECUPERAR LOGIN SALVO
  if(!currentUser){

    const saved = localStorage.getItem("miniHUser");

    if(saved){

      currentUser = JSON.parse(saved);

    }

  }

  if(!currentUser){

    alert("Faça login primeiro");

    return;

  }

  

  const texto =
    document.getElementById("texto").value;

  const mediaInput =
    document.getElementById("media");

  const file = mediaInput.files[0];

  let media = "";

  if(file){

    media = await toBase64(file);

  }

  const tipo =
    document.getElementById("tipo").value;

  const res = await api({

    action:"createPost",

    username:currentUser.username,

    avatar:currentUser.avatar,

    texto,

    media,

    tipo

  });

  if(res.success){

    document.getElementById("texto").value = "";

    document.getElementById("media").value = "";

    loadPosts();

  }

}

async function loadPosts(){

  const posts = await api({

    action:"getPosts"

  });

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  posts.forEach(post => {

    let mediaHTML = "";

    if(post.media){

      if(post.tipo == "image"){

        mediaHTML =
          `<img src="${post.media}">`;

      } else {

        mediaHTML =
          `<video controls src="${post.media}"></video>`;

      }

    }

    feed.innerHTML += `

      <div class="post">

        <div class="post-header">

          <img
            class="post-avatar"
            src="${
              post.avatar ||
              "https://i.imgur.com/HeIi0wU.png"
            }"
          >

          <div>

            <div class="username">
              ${post.username}
            </div>

            <div class="handle">
              @${post.username}
            </div>

          </div>

        </div>

        <div class="post-content">

          <p>${post.texto}</p>

          ${mediaHTML}

          <div class="actions">

            <button onclick="curtir('${post.id}')">
              ❤️ ${post.likes}
            </button>

          </div>

        </div>

      </div>

    `;

  });

}

function logout(){

  localStorage.removeItem("miniHUser");

  location.reload();

}

async function curtir(id){

  await api({

    action:"likePost",

    id

  });

  loadPosts();

}

</script>

</body>
</html>
