<script>

let currentUser = null;

const API =
"https://script.google.com/macros/s/AKfycbxQ2d3ZPTTR6_GND9_SzTnOf7o0BVkpUFKC1qEwvSHAe6SniRSX5hGCIgtN1dF2FLWO9g/exec";

/* =========================
   INICIALIZAÇÃO SEGURA
========================= */

window.onload = () => {

  const savedUser =
    localStorage.getItem("miniHUser");

  if(savedUser){

    try{

      currentUser =
        JSON.parse(savedUser);

      if(currentUser && currentUser.username){

        entrarNoSistema();

      } else {

        localStorage.removeItem("miniHUser");

      }

    } catch(e){

      localStorage.removeItem("miniHUser");

    }

  }

};

/* =========================
   API
========================= */

async function api(data){

  const req = await fetch(API, {

    method:"POST",
    body:JSON.stringify(data)

  });

  return req.json();

}

/* =========================
   LOGIN
========================= */

async function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const res = await api({

    action:"login",
    username,
    password

  });

  if(res.success){

    currentUser = res.user;

    localStorage.setItem(
      "miniHUser",
      JSON.stringify(currentUser)
    );

    entrarNoSistema();

  } else {

    alert(res.message);

  }

}

/* =========================
   ENTRAR NO SITE
========================= */

function entrarNoSistema(){

  document.getElementById("loginScreen")
    .style.display = "none";

  document.getElementById("sidebarAvatar")
    .src =
      currentUser.avatar ||
      "https://i.imgur.com/HeIi0wU.png";

  document.getElementById("sidebarName")
    .innerText =
      "@" + currentUser.username;

  document.getElementById("welcomeText")
    .innerText =
      "Bem-vindo, @" +
      currentUser.username;

  loadPosts();

}

/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem("miniHUser");
  location.reload();

}

/* =========================
   BASE64 MEDIA
========================= */

function toBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.readAsDataURL(file);

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      err => reject(err);

  });

}

/* =========================
   POSTAR (CORRIGIDO)
========================= */

async function postar(){

  const savedUser =
    localStorage.getItem("miniHUser");

  if(savedUser){

    currentUser =
      JSON.parse(savedUser);

  }

  if(!currentUser || !currentUser.username){

    alert("Faça login primeiro");
    return;

  }

  const texto =
    document.getElementById("texto").value;

  const file =
    document.getElementById("media").files[0];

  const tipo =
    document.getElementById("tipo").value;

  let media = "";

  if(file){

    media =
      await toBase64(file);

  }

  const res = await api({

    action:"createPost",

    username:currentUser.username,
    avatar:currentUser.avatar || "",
    texto,
    media,
    tipo

  });

  if(res.success){

    document.getElementById("texto").value = "";
    document.getElementById("media").value = "";

    loadPosts();

  }

}

/* =========================
   CARREGAR POSTS
========================= */

async function loadPosts(){

  const posts =
    await api({ action:"getPosts" });

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  posts.forEach(post => {

    let mediaHTML = "";

    if(post.media){

      if(post.tipo == "image"){

        mediaHTML =
          `<img src="${post.media}">`;

      } else {

        mediaHTML =
          `<video controls src="${post.media}"></video>`;

      }

    }

    feed.innerHTML += `

      <div class="post">

        <div class="postHeader">

          <img class="postAvatar"
            src="${post.avatar || "https://i.imgur.com/HeIi0wU.png"}">

          <div>

            <b>${post.username}</b>
            <div style="color:gray;">
              @${post.username}
            </div>

          </div>

        </div>

        <div class="postContent">

          <p>${post.texto}</p>

          ${mediaHTML}

          <button class="likeBtn"
            onclick="curtir('${post.id}')">

            ❤️ ${post.likes}

          </button>

        </div>

      </div>

    `;

  });

}

/* =========================
   CURTIR
========================= */

async function curtir(id){

  await api({

    action:"likePost",
    id

  });

  loadPosts();

}

</script>
